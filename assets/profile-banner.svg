<text x="38" y="230" fill="#bbc8bd" font-family="Arial,sans-serif" font-size="19">José Willians</text>
<text x="198" y="230" fill="#7f9185" font-family="Arial,sans-serif" font-size="14">Ideias que viram projetos.</text>

<rect width="1000" height="280" rx="16" fill="url(#bg)"/>
<path d="M0 1H1000M0 279H1000" stroke="#303c32"/>
<path d="M640 0V280M700 0V280M760 0V280M820 0V280M880 0V280M940 0V280M600 50H1000M600 110H1000M600 170H1000M600 230H1000" stroke="#c7f36b" stroke-opacity=".05"/>
<rect x="36" y="34" width="49" height="38" rx="7" fill="#c7f36b"/>
<text x="45" y="60" fill="#141b14" font-family="Arial,sans-serif" font-size="21" font-weight="800">JW.</text>
<text x="101" y="58" fill="#aebbb1" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">DESENVOLVIMENTO · AUTOMAÇÃO · TI</text>
